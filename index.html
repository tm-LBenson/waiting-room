<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CodeX Level 1 - Waiting Room Tips</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0b1020;
    --fg:#e5e7eb;
    --accent:#2f80ed;
    --slide-seconds:5.5;
    --fade-ms:600;
    --maxw:900px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap{
    text-align:center;
    padding:40px 24px;
    width:100%;
    max-width:var(--maxw);
  }
  .tag{
    font-size:14px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#b3c2ff;
    margin-bottom:8px;
  }
  .rule{
    width:120px; height:3px; margin:10px auto 26px auto;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    border-radius:3px;
  }
  .slide{
    font-size:44px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:.2px;
    margin:0 auto;
    transition:opacity calc(var(--fade-ms)*1ms) ease;
    opacity:0;
    min-height:4.5em; 
  }
  .slide.show{ opacity:1; }
  .sub{
    margin-top:28px;
    font-size:18px;
    color:#c7cad3;
  }
  @media (max-width:900px){ .slide{font-size:36px} }
  @media (max-width:600px){ .slide{font-size:28px} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">CodeX Level 1</div>
    <div class="rule"></div>
    <div id="slide" class="slide"></div>
    <div class="sub">Class will be starting soon...</div>
  </div>

<script>
  const SECONDS_PER_SLIDE = 5.5;  
  const FADE_MS = 600;            

const tips = [
  "Feeling stuck? Message a TA on Slack.",
  "Read error messages slowly. They usually point to the line that matters.",
  "Use meaningful link text. Prefer \"Contact us\" over \"click here\".",
  "There is only one &lt;h1&gt; per page.",
  "Add alt text to every image. Example: &lt;img alt=\"site logo\" ...&gt;",
  "Use header, nav, main, and footer for clear structure.",
  "Keep file names lowercase-with-hyphens. Avoid spaces.",
  "Keep paragraphs short and readable.",
  "Use lists for lists. &lt;ul&gt;&lt;li&gt;...&lt;/li&gt;&lt;/ul&gt;",
  "CSS belongs in a stylesheet when possible. Keep structure and style separate.",
  "Check contrast. Text should be readable on your background.",
  "Make navigation work in both directions between pages.",
  "Test on a narrow screen. Does your layout stack cleanly?",
  "Save your Code.org Share link and paste it into Moodle.",
  "DevTools: right click, Inspect, edit HTML and CSS live.",
  "Hard refresh if changes do not show: Ctrl-Shift-R (Windows) or Cmd-Shift-R (Mac).",
  "w3schools.com has quick HTML, CSS, and JS references.",
  "Try a small wireframe before you build.",
  "Practice typing. Accuracy first, speed comes next.",
  "Variables store values you can reuse. Name them clearly.",
  "Functions package steps. Give them verbs in the name.",
  "Conditionals choose paths. Start with if (condition) { ... }",
  "Events make pages feel alive. Start simple.",
  "console.log is your friend when debugging JavaScript.",
  "In App Lab, use onEvent to respond to clicks and taps.",
  "Break problems into small steps. Ship a small slice, then improve it.",
  "One improvement at a time. Keep going.",
  "Ask questions early. There are no bad questions here.",
  "Pair programming: driver types, navigator guides. Switch often.",
  "Keep images small when possible. Large files slow pages.",
  "Be kind to your future self. Name things clearly.",
  "Take a 10-minute break every 45 to 60 minutes.",
  "Drink water. Brains run better hydrated.",
  "When stuck for 10 minutes, ask a TA or classmate.",
  "Focus on one small goal at a time. Ship the smallest next step.",
  "Try a smaller example of the problem. Prove one tiny piece works.",
  "Write down what you plan to try next before you try it."
];

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  const el = document.getElementById("slide");
  let i = -1;

  function showNext(){
  
    el.classList.remove("show");
    setTimeout(()=>{
      i = (i + 1) % tips.length;
      el.innerHTML = tips[i];
      // fade in
      el.classList.add("show");
    }, FADE_MS);
  }

  el.innerHTML = tips[0];
  el.classList.add("show");
  i = 0;

  setInterval(showNext, SECONDS_PER_SLIDE * 1000);
</script>
</body>
</html>
